name: Bug report
description: Report a reproducible problem in Momo-LM.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove secrets, personal data, model prompts, and private checkpoints before submitting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.3.0 or a full commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the exact command, minimal input, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste sanitized `momo inspect`, backend information, and relevant logs.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I removed credentials, personal data, private training text, and proprietary weights.
          required: true
        - label: This is not a security vulnerability. I will use private reporting for vulnerabilities.
          required: true
