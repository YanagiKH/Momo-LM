name: Build installers and publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  MOMO_REQUIRE_NATIVE: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m compileall -q momo_lm scripts tests
      - run: python scripts/validate_repo.py
      - run: python -m unittest discover -s tests -v
      - run: cargo test --manifest-path native/rust/Cargo.toml --release --locked
      - run: momo backend && momo benchmark --size 64 --rounds 1
      - run: python -m build

  windows-installer:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip pyinstaller && python -m pip install .
      - run: pyinstaller --clean --noconfirm packaging/momo_lm.spec
      - name: Smoke test packaged application
        shell: pwsh
        run: |
          .\dist\Momo-LM\Momo-LM.exe backend
          .\dist\Momo-LM\Momo-LM.exe --home .release-home init
          .\dist\Momo-LM\Momo-LM.exe --home .release-home inspect
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $env:MOMO_VERSION = $env:RELEASE_TAG.TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\windows.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path "release\Momo-LM-Setup-Windows-x64.exe")) {
            throw "Inno Setup did not produce the Windows installer"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/Momo-LM-Setup-Windows-x64.exe
          if-no-files-found: error

  linux-installer:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip pyinstaller && python -m pip install .
      - run: pyinstaller --clean --noconfirm packaging/momo_lm.spec
      - name: Smoke test packaged application
        run: ./dist/Momo-LM/Momo-LM backend && ./dist/Momo-LM/Momo-LM --home .release-home init && ./dist/Momo-LM/Momo-LM --home .release-home inspect
      - name: Build self-extracting Linux installer
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself
          mkdir -p release payload/app
          cp -R dist/Momo-LM/. payload/app/
          cp installer/linux-install.sh payload/install.sh
          chmod +x payload/install.sh payload/app/Momo-LM
          makeself --nox11 payload release/Momo-LM-Setup-Linux-x64.run "Momo-LM ${RELEASE_TAG}" ./install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: release/Momo-LM-Setup-Linux-x64.run
          if-no-files-found: error

  publish:
    needs: [windows-installer, linux-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/Momo-LM-Setup-Windows-x64.exe
            release/Momo-LM-Setup-Linux-x64.run
