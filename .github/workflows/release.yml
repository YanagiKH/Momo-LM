name: Build installers and publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version v* tag to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      MOMO_REQUIRE_NATIVE: "1"
    steps:
      - name: Validate release tag syntax
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic-version tag beginning with v" >&2
            exit 1
          fi
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm immutable tag exists
        shell: bash
        run: git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Validate release source
        run: |
          ruff check .
          python -m compileall -q momo_lm scripts tests
          python scripts/validate_repo.py
          python -m unittest discover -s tests -v
          cargo fmt --manifest-path native/rust/Cargo.toml --all -- --check
          cargo test --manifest-path native/rust/Cargo.toml --release --locked
          cargo clippy --manifest-path native/rust/Cargo.toml --all-targets --locked -- -D warnings
          momo backend
          momo benchmark --size 64 --rounds 1
          python -m build

  windows-installer:
    name: Build Windows installer
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      MOMO_REQUIRE_NATIVE: "1"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          pyinstaller --clean --noconfirm packaging/momo_lm.spec
      - name: Test packaged application
        shell: pwsh
        run: |
          .\dist\Momo-LM\Momo-LM.exe backend
          .\dist\Momo-LM\Momo-LM.exe --home .release-home init
          .\dist\Momo-LM\Momo-LM.exe --home .release-home inspect
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $env:MOMO_VERSION = $env:RELEASE_TAG.TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\windows.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path "release\Momo-LM-Setup-Windows-x64.exe")) {
            throw "Inno Setup did not produce the Windows installer"
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: release/Momo-LM-Setup-Windows-x64.exe
          if-no-files-found: error
          retention-days: 7

  linux-installer:
    name: Build Linux installer
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      MOMO_REQUIRE_NATIVE: "1"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          pyinstaller --clean --noconfirm packaging/momo_lm.spec
      - name: Test packaged application
        shell: bash
        run: |
          ./dist/Momo-LM/Momo-LM backend
          ./dist/Momo-LM/Momo-LM --home .release-home init
          ./dist/Momo-LM/Momo-LM --home .release-home inspect
      - name: Build self-extracting installer
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends makeself
          mkdir -p release payload/app
          cp -R dist/Momo-LM/. payload/app/
          cp installer/linux-install.sh payload/install.sh
          chmod +x payload/install.sh payload/app/Momo-LM
          makeself --nox11 payload release/Momo-LM-Setup-Linux-x64.run "Momo-LM ${RELEASE_TAG}" ./install.sh
      - name: Upload Linux installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-installer
          path: release/Momo-LM-Setup-Linux-x64.run
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [windows-installer, linux-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true
      - name: Create SHA-256 checksums
        shell: bash
        run: |
          cd release
          sha256sum Momo-LM-Setup-Windows-x64.exe Momo-LM-Setup-Linux-x64.run > SHA256SUMS.txt
      - name: Publish release assets
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/Momo-LM-Setup-Windows-x64.exe
            release/Momo-LM-Setup-Linux-x64.run
            release/SHA256SUMS.txt
