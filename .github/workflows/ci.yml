name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    env:
      MOMO_REQUIRE_NATIVE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project and validation tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Verify required native backend
        run: momo backend
      - name: Compile Python sources
        run: python -m compileall -q momo_lm scripts tests
      - name: Run static analysis
        run: ruff check .
      - name: Validate repository assets and checkpoints
        run: python scripts/validate_repo.py
      - name: Run unit and HTTP integration tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: python -m build
      - name: Test installed wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          momo --home .ci-home init
          momo --home .ci-home inspect
          momo benchmark --size 64 --rounds 1

  native-core:
    name: C/C++/Rust core · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show native toolchains
        run: |
          cmake --version
          cargo --version
          rustc --version
      - name: Check Rust formatting
        run: cargo fmt --manifest-path native/rust/Cargo.toml --all -- --check
      - name: Test Rust core
        run: cargo test --manifest-path native/rust/Cargo.toml --release --locked
      - name: Lint Rust core
        run: cargo clippy --manifest-path native/rust/Cargo.toml --all-targets --locked -- -D warnings
      - name: Configure C/C++ core
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build C/C++ core
        run: cmake --build build/native --config Release
      - name: Test C/C++ core
        run: ctest --test-dir build/native -C Release --output-on-failure

  sanitizers:
    name: Sanitizers · ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure ASan and UBSan build
        run: cmake -S native -B build/sanitized -DCMAKE_BUILD_TYPE=Debug -DMOMO_ENABLE_SANITIZERS=ON
      - name: Build sanitized core
        run: cmake --build build/sanitized --parallel 2
      - name: Test sanitized core
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/sanitized --output-on-failure

  fallback-install:
    name: Clean sdist · NumPy fallback
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install source build tools
        run: python -m pip install --upgrade pip build
      - name: Reject partial required-native builds
        shell: bash
        run: |
          if MOMO_REQUIRE_NATIVE=1 MOMO_BUILD_RUST=0 python setup.py build_ext --inplace --force; then
            echo "required-native build unexpectedly succeeded without Rust"
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path

          package = Path("momo_lm")
          extensions = [
              candidate
              for pattern in ("_native*.so", "_native*.pyd", "_native*.dylib", "_native*.dll")
              for candidate in package.glob(pattern)
          ]
          rust_dir = package / "_native_libs"
          rust_libraries = list(rust_dir.iterdir()) if rust_dir.is_dir() else []
          assert not extensions, f"partial C/C++ extensions remain: {extensions}"
          assert not rust_libraries, f"partial Rust libraries remain: {rust_libraries}"
          PY
      - name: Build clean source distribution
        run: python -m build --sdist
      - name: Install without C/C++ or Rust compilers
        shell: bash
        env:
          CC: momo-missing-cc
          CXX: momo-missing-cxx
          MOMO_BUILD_RUST: "0"
        run: |
          python -m venv .fallback-venv
          .fallback-venv/bin/python -m pip install --upgrade pip
          .fallback-venv/bin/python -m pip install --no-cache-dir dist/*.tar.gz
      - name: Verify clean NumPy-only installation
        shell: bash
        env:
          MOMO_BACKEND: numpy
        run: |
          .fallback-venv/bin/python -I - <<'PY'
          import importlib.util
          from pathlib import Path
          import sys

          import momo_lm
          from momo_lm.backend import get_backend

          package = Path(momo_lm.__file__).resolve().parent
          environment = Path(sys.prefix).resolve()
          assert environment in package.parents, (package, environment)
          native_libs = package / "_native_libs"
          assert importlib.util.find_spec("momo_lm._native") is None
          assert not native_libs.exists() or not any(native_libs.iterdir())
          backend = get_backend()
          assert backend.name == "numpy"
          assert backend.native is False
          print(f"NumPy fallback loaded from {package}")
          PY

  package-smoke:
    name: Executable smoke · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      MOMO_REQUIRE_NATIVE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and PyInstaller
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Build executable
        run: pyinstaller --clean --noconfirm packaging/momo_lm.spec
      - name: Test Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./dist/Momo-LM/Momo-LM backend
          ./dist/Momo-LM/Momo-LM --home .package-home init
          ./dist/Momo-LM/Momo-LM --home .package-home inspect
      - name: Test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\dist\Momo-LM\Momo-LM.exe backend
          .\dist\Momo-LM\Momo-LM.exe --home .package-home init
          .\dist\Momo-LM\Momo-LM.exe --home .package-home inspect
      - name: Compile Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MOMO_VERSION: 0.0.0-ci
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler"
          }
          New-Item -ItemType Directory -Force release | Out-Null
          & $compiler "installer\windows.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path "release\Momo-LM-Setup-Windows-x64.exe")) {
            throw "Inno Setup did not produce the Windows installer"
          }
