<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Momo-LM bounded agent workbench</title>
  <desc id="desc">Agent profile, capabilities, budgets, deterministic plan, event log, and one-use approval panel.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a0917"/><stop offset="1" stop-color="#1c1230"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#ff76d2"/><stop offset="1" stop-color="#8b70ff"/></linearGradient>
  </defs>
  <rect width="1440" height="900" rx="28" fill="url(#bg)"/>
