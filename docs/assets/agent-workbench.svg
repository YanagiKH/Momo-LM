    <text x="544" y="536" fill="#ffc46f" font-size="13" font-weight="700">只核准 step 2 的精確 tool 與 arguments</text>
    <text x="544" y="565" fill="#a9a2b6" font-size="12">arguments SHA-256　91a2…e402　·　15 分鐘後過期　·　只可消耗一次</text>
    <rect x="1145" y="575" width="171" height="34" rx="10" fill="url(#accent)"/><text x="1230" y="597" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">核准這個動作</text>
    <text x="520" y="669" fill="#918ba4" font-size="12">EVENTS</text>
    <line x1="539" y1="698" x2="539" y2="787" stroke="#4c4263" stroke-width="2"/>
    <circle cx="539" cy="706" r="6" fill="#55d7aa"/><text x="562" y="711" fill="#e9e5f0" font-size="13">step 1 completed</text><text x="1198" y="711" fill="#736d80" font-size="11">seq 3</text>
    <circle cx="539" cy="746" r="6" fill="#f0a84b"/><text x="562" y="751" fill="#e9e5f0" font-size="13">approval requested</text><text x="1198" y="751" fill="#736d80" font-size="11">seq 4</text>
    <circle cx="539" cy="786" r="6" fill="#8b70ff"/><text x="562" y="791" fill="#e9e5f0" font-size="13">state saved to SQLite WAL</text><text x="1198" y="791" fill="#736d80" font-size="11">local</text>
