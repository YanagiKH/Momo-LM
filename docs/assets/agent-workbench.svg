    <text x="520" y="202" fill="#fff" font-size="20" font-weight="700">工作 7fa21c…</text>
    <rect x="1188" y="174" width="152" height="36" rx="18" fill="#f0a84b1c" stroke="#f0a84b70"/><circle cx="1208" cy="192" r="5" fill="#f0a84b"/><text x="1222" y="197" fill="#ffc46f" font-size="12">等待核准</text>
    <text x="520" y="249" fill="#918ba4" font-size="12">DETERMINISTIC PLAN</text>
    <rect x="520" y="265" width="822" height="82" rx="13" fill="#0d0c19" stroke="#332e49"/>
    <circle cx="548" cy="306" r="13" fill="#55d7aa"/><text x="548" y="311" text-anchor="middle" fill="#081610" font-size="12" font-weight="700">1</text>
    <text x="577" y="298" fill="#fff" font-size="14" font-weight="700">list_files</text><text x="577" y="323" fill="#8f899f" font-size="12">已完成 · workspace.read</text>
    <rect x="520" y="362" width="822" height="82" rx="13" fill="#181426" stroke="#ff76d260"/>
    <circle cx="548" cy="403" r="13" fill="url(#accent)"/><text x="548" y="408" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">2</text>
