    <text x="112" y="388" fill="#eeeaf5" font-size="14">write: reports/summary.md</text>
    <text x="112" y="418" fill="#b1abc0" font-size="13"># Draft</text>
    <text x="112" y="442" fill="#b1abc0" font-size="13">Review before sending.</text>
    <text x="94" y="507" fill="#918ba4" font-size="12">CAPABILITIES</text>
    <rect x="94" y="522" width="155" height="34" rx="17" fill="#ff76d21c" stroke="#ff76d26f"/>
    <text x="111" y="544" fill="#ff92dd" font-size="12">workspace.write</text>
    <text x="94" y="596" fill="#918ba4" font-size="12">BUDGETS</text>
    <rect x="94" y="611" width="100" height="62" rx="10" fill="#ffffff08"/><text x="108" y="635" fill="#817b91" font-size="10">STEPS</text><text x="108" y="660" fill="#fff" font-size="19">3</text>
    <rect x="205" y="611" width="100" height="62" rx="10" fill="#ffffff08"/><text x="219" y="635" fill="#817b91" font-size="10">TOOLS</text><text x="219" y="660" fill="#fff" font-size="19">3</text>
    <rect x="316" y="611" width="110" height="62" rx="10" fill="#ffffff08"/><text x="330" y="635" fill="#817b91" font-size="10">INPUT</text><text x="330" y="660" fill="#fff" font-size="19">2,000</text>
    <rect x="94" y="726" width="332" height="54" rx="13" fill="url(#accent)"/><text x="260" y="760" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">建立並執行</text>
  </g>
  <rect x="486" y="154" width="890" height="682" rx="22" fill="#141225" stroke="#342e4c"/>
