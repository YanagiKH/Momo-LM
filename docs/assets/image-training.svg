<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Momo-LM image generation and training</title>
  <desc id="desc">Four style previews, generation controls, licensed manifest status, and reconstruction loss.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090816"/><stop offset="1" stop-color="#1a112c"/></linearGradient>
    <linearGradient id="pink"><stop stop-color="#ff78d5"/><stop offset="1" stop-color="#8b70ff"/></linearGradient>
    <linearGradient id="anime" x2="0" y2="1"><stop stop-color="#91bfff"/><stop offset="1" stop-color="#ff9dcf"/></linearGradient>
    <linearGradient id="ill" x2="0" y2="1"><stop stop-color="#ffb28b"/><stop offset="1" stop-color="#305f56"/></linearGradient>
    <linearGradient id="real" x2="0" y2="1"><stop stop-color="#91b6d1"/><stop offset="1" stop-color="#344737"/></linearGradient>
  </defs>
  <rect width="1440" height="900" rx="28" fill="url(#bg)"/>
  <text x="64" y="68" fill="#ff78d4" font-family="Arial" font-size="11" letter-spacing="3">TINY CANVAS V2 · 3,963 PARAMETERS</text>
  <text x="64" y="112" fill="#fff" font-family="Arial" font-size="34" font-weight="700">圖像生成與可重現訓練</text>
  <g font-family="Arial">
    <rect x="64" y="154" width="840" height="682" rx="22" fill="#141225" stroke="#342e4c"/>
    <text x="94" y="200" fill="#fff" font-size="20" font-weight="700">Style conditioning</text>
    <rect x="94" y="226" width="180" height="180" rx="16" fill="url(#anime)"/><ellipse cx="184" cy="316" rx="50" ry="62" fill="#ffc4a9"/><path d="M134 300Q150 228 224 263L240 309Q206 271 134 300" fill="#2c2040"/><circle cx="168" cy="319" r="6" fill="#24395e"/><circle cx="202" cy="319" r="6" fill="#24395e"/><text x="184" y="435" text-anchor="middle" fill="#ff94dc" font-size="13">anime</text>
    <rect x="292" y="226" width="180" height="180" rx="16" fill="#efefef"/><rect x="305" y="239" width="154" height="154" fill="none" stroke="#17151b" stroke-width="5"/><ellipse cx="382" cy="316" rx="48" ry="61" fill="none" stroke="#17151b" stroke-width="5"/><path d="M334 294Q351 232 431 272" fill="none" stroke="#17151b" stroke-width="9"/><text x="382" y="435" text-anchor="middle" fill="#ff94dc" font-size="13">manga</text>
    <rect x="490" y="226" width="180" height="180" rx="16" fill="url(#ill)"/><circle cx="618" cy="277" r="21" fill="#ffe28b"/><path d="M490 344Q539 299 580 338T670 320V406H490Z" fill="#426b5c"/><path d="M490 371Q538 339 592 369T670 354V406H490Z" fill="#24483f"/><text x="580" y="435" text-anchor="middle" fill="#ff94dc" font-size="13">illustration</text>
    <rect x="688" y="226" width="180" height="180" rx="16" fill="url(#real)"/><circle cx="778" cy="316" r="58" fill="#7a3e25"/><circle cx="758" cy="295" r="25" fill="#d99d6c" opacity=".8"/><ellipse cx="778" cy="383" rx="72" ry="12" fill="#18281e" opacity=".45"/><text x="778" y="435" text-anchor="middle" fill="#ff94dc" font-size="13">realistic label</text>
    <text x="94" y="487" fill="#928ca4" font-size="12">PROMPT</text>
    <rect x="94" y="502" width="774" height="48" rx="11" fill="#0c0b18" stroke="#413958"/><text x="114" y="532" fill="#eeeaf5" font-size="14">午後窗邊的角色插畫</text>
    <text x="94" y="589" fill="#928ca4" font-size="12">NEGATIVE PROMPT</text>
    <rect x="94" y="604" width="374" height="48" rx="11" fill="#0c0b18" stroke="#413958"/><text x="114" y="634" fill="#aaa4b5" font-size="14">文字, 浮水印</text>
    <text x="492" y="589" fill="#928ca4" font-size="12">SUPERSAMPLING PRESET / STEPS / TILE</text>
    <rect x="492" y="604" width="376" height="48" rx="11" fill="#0c0b18" stroke="#413958"/><text x="512" y="634" fill="#eeeaf5" font-size="14">quality=high　·　4　·　128 px</text>
    <rect x="94" y="706" width="774" height="54" rx="13" fill="url(#pink)"/><text x="481" y="740" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">以固定 seed 產生</text>
    <text x="94" y="795" fill="#898397" font-size="12">Style 是 conditioning label；realistic 不代表攝影寫實品質。</text>
    <rect x="934" y="154" width="442" height="682" rx="22" fill="#141225" stroke="#342e4c"/>
    <text x="968" y="200" fill="#fff" font-size="20" font-weight="700">Manifest training</text>
    <rect x="968" y="228" width="374" height="92" rx="13" fill="#0d0c19" stroke="#332e49"/><circle cx="992" cy="257" r="6" fill="#57d9ad"/><text x="1010" y="262" fill="#e7e3ee" font-size="13">4 / 4 hashes verified</text><circle cx="992" cy="289" r="6" fill="#57d9ad"/><text x="1010" y="294" fill="#e7e3ee" font-size="13">source + license present</text>
    <text x="968" y="365" fill="#928ca4" font-size="12">RECONSTRUCTION LOSS</text>
    <text x="968" y="411" fill="#fff" font-size="27" font-weight="700">0.140237 → 0.072889</text>
    <path d="M970 521C1015 424 1054 506 1096 448S1183 468 1223 403S1292 421 1338 375" fill="none" stroke="url(#pink)" stroke-width="4"/>
    <line x1="968" y1="536" x2="1342" y2="536" stroke="#332e49"/>
    <text x="968" y="582" fill="#928ca4" font-size="12">BUNDLED REFERENCE RUN</text>
    <rect x="968" y="600" width="112" height="78" rx="11" fill="#ffffff08"/><text x="984" y="628" fill="#817b91" font-size="10">STEPS</text><text x="984" y="660" fill="#fff" font-size="22">96</text>
    <rect x="1090" y="600" width="112" height="78" rx="11" fill="#ffffff08"/><text x="1106" y="628" fill="#817b91" font-size="10">IMAGES</text><text x="1106" y="660" fill="#fff" font-size="22">4</text>
    <rect x="1212" y="600" width="130" height="78" rx="11" fill="#ffffff08"/><text x="1228" y="628" fill="#817b91" font-size="10">SAMPLES</text><text x="1228" y="660" fill="#fff" font-size="22">512</text>
    <rect x="968" y="716" width="374" height="72" rx="12" fill="#241d35"/><text x="988" y="745" fill="#ff91dc" font-size="12" font-weight="700">不是 held-out 評估</text><text x="988" y="770" fill="#9c95ad" font-size="11">四張程序圖同時用於訓練與 loss 回歸。</text>
  </g>
</svg>
