<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Momo-LM training and weight inspection preview</title><desc id="desc">Training data cards and inspectable neural model layers.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a0917"/><stop offset="1" stop-color="#1a102c"/></linearGradient><linearGradient id="a"><stop stop-color="#fc74d2"/><stop offset="1" stop-color="#8c72ff"/></linearGradient></defs>
  <rect width="1440" height="900" rx="28" fill="url(#bg)"/><text x="70" y="75" fill="#fc74d2" font-family="Arial" font-size="11" letter-spacing="3">TRAIN · INSPECT · VERSION</text><text x="70" y="120" fill="#fff" font-family="Arial" font-size="35" font-weight="700">建立專屬知識與觀察權重</text>
  <g font-family="Arial"><rect x="70" y="165" width="785" height="650" rx="22" fill="#141225" stroke="#302b47"/><rect x="100" y="200" width="42" height="42" rx="13" fill="#f875d21c" stroke="#f875d270"/><text x="121" y="227" text-anchor="middle" fill="#ff7bd7" font-size="17" font-weight="700">Aa</text><text x="100" y="275" fill="#fff" font-size="22" font-weight="700">餵入文字</text><text x="100" y="307" fill="#9d97af" font-size="15">輸入教材、問答、文件或垂直領域知識，內容只保存在本機。</text>
  <rect x="100" y="340" width="725" height="48" rx="11" fill="#0c0b17" stroke="#302b47"/><text x="120" y="370" fill="#b2acc0" font-size="14">來源：medical-notes-v1</text><rect x="100" y="410" width="725" height="235" rx="11" fill="#0c0b17" stroke="#493d66"/><text x="120" y="448" fill="#eee9f6" font-size="15">領域術語與高品質問答資料…</text><text x="120" y="482" fill="#7c768c" font-size="13">資料會被切成重疊片段，寫入 SQLite 知識庫，</text><text x="120" y="509" fill="#7c768c" font-size="13">並可選擇用原生加速反向傳播更新模型權重。</text>
  <rect x="100" y="680" width="20" height="20" rx="5" fill="url(#a)"/><path d="M106 690l4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/><text x="132" y="695" fill="#b5afc2" font-size="13">同時訓練　　Epochs: 3</text><rect x="635" y="666" width="190" height="50" rx="12" fill="url(#a)"/><text x="730" y="697" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">開始學習</text><rect x="100" y="747" width="725" height="34" rx="8" fill="#211b35"/><rect x="100" y="747" width="548" height="34" rx="8" fill="url(#a)"/><text x="760" y="770" fill="#d9d4e5" font-size="12">75%</text></g>
  <g font-family="Arial"><rect x="885" y="165" width="485" height="650" rx="22" fill="#141225" stroke="#302b47"/><text x="920" y="215" fill="#fff" font-size="22" font-weight="700">文字模型權重</text><text x="920" y="245" fill="#9d97af" font-size="14">184,131 parameters · 30 epochs</text>
  <g transform="translate(920 285)"><text y="15" fill="#fff" font-size="13" font-weight="700">embedding</text><text x="135" y="15" fill="#817a92" font-size="12">259 × 32</text><rect x="0" y="30" width="390" height="10" rx="5" fill="#2a2640"/><rect width="105" height="10" y="30" rx="5" fill="url(#a)"/><text y="76" fill="#fff" font-size="13" font-weight="700">w_hidden</text><text x="135" y="76" fill="#817a92" font-size="12">768 × 96</text><rect y="92" width="390" height="10" rx="5" fill="#2a2640"/><rect y="92" width="390" height="10" rx="5" fill="url(#a)"/><text y="138" fill="#fff" font-size="13" font-weight="700">b_hidden</text><text x="135" y="138" fill="#817a92" font-size="12">96</text><rect y="154" width="390" height="10" rx="5" fill="#2a2640"/><rect y="154" width="14" height="10" rx="5" fill="url(#a)"/><text y="200" fill="#fff" font-size="13" font-weight="700">w_output</text><text x="135" y="200" fill="#817a92" font-size="12">96 × 259</text><rect y="216" width="390" height="10" rx="5" fill="#2a2640"/><rect y="216" width="132" height="10" rx="5" fill="url(#a)"/></g>
  <rect x="920" y="570" width="190" height="92" rx="14" fill="#ffffff08"/><text x="940" y="600" fill="#8e879f" font-size="12">TRAINING STEPS</text><text x="940" y="640" fill="#fff" font-size="27" font-weight="700">1,020</text><rect x="1125" y="570" width="210" height="92" rx="14" fill="#ffffff08"/><text x="1145" y="600" fill="#8e879f" font-size="12">TOKENS SEEN</text><text x="1145" y="640" fill="#fff" font-size="27" font-weight="700">138,660</text><path d="M920 742 C960 700 1005 765 1040 720 S1120 745 1160 700 S1250 745 1330 690" fill="none" stroke="url(#a)" stroke-width="4"/><line x1="920" y1="770" x2="1330" y2="770" stroke="#302b47"/></g>
</svg>
