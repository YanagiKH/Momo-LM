<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Momo-LM chat workbench preview</title><desc id="desc">Dark local AI workbench with navigation, chat messages, model status, and prompt input.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090816"/><stop offset="1" stop-color="#17102b"/></linearGradient><linearGradient id="pink"><stop stop-color="#ff79d7"/><stop offset="1" stop-color="#8d70ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="18"/></filter></defs>
  <rect width="1440" height="900" rx="28" fill="url(#bg)"/><circle cx="1130" cy="90" r="230" fill="#7937aa" opacity=".18" filter="url(#glow)"/>
  <rect x="0" width="260" height="900" rx="28" fill="#0d0c1c"/><line x1="260" x2="260" y2="900" stroke="#302b47"/>
  <rect x="30" y="32" width="48" height="48" rx="15" fill="url(#pink)"/><text x="54" y="65" text-anchor="middle" fill="white" font-size="25" font-weight="800" font-family="Arial">M</text><text x="94" y="56" fill="#fff" font-size="23" font-weight="700" font-family="Arial">Momo-LM</text><text x="94" y="73" fill="#8f8aa6" font-size="9" letter-spacing="2" font-family="Arial">LOCAL AI WORKBENCH</text>
  <g font-family="Arial" font-size="16"><rect x="20" y="128" width="220" height="50" rx="12" fill="#ffffff0e"/><rect x="20" y="128" width="3" height="50" fill="#ff79d7"/><text x="45" y="159" fill="#fff">◌　對話</text><text x="45" y="210" fill="#9a95ae">↗　學習資料</text><text x="45" y="261" fill="#9a95ae">◇　圖像生成</text><text x="45" y="312" fill="#9a95ae">▤　圖像訓練</text><text x="45" y="363" fill="#9a95ae">◎　代理工作</text><text x="45" y="414" fill="#9a95ae">♫　文字轉語音</text><text x="45" y="465" fill="#9a95ae">▦　權重觀察</text><text x="45" y="516" fill="#9a95ae">⬡　Mods</text></g>
  <rect x="22" y="785" width="216" height="70" rx="14" fill="#ffffff08" stroke="#2e2a44"/><circle cx="47" cy="820" r="6" fill="#64e4b9"/><text x="65" y="816" fill="#fff" font-size="13" font-family="Arial">本機模型已就緒</text><text x="65" y="837" fill="#8f8aa6" font-size="11" font-family="Arial">223,835 parameters · native</text>
  <text x="325" y="70" fill="#ff79d7" font-size="10" letter-spacing="3" font-family="Arial">NO API KEY · LOCAL FIRST</text><text x="325" y="112" fill="#fff" font-size="34" font-weight="700" font-family="Arial">與 Momo 對話</text>
  <rect x="1160" y="57" width="210" height="44" rx="22" fill="#171426" stroke="#302b47"/><text x="1180" y="84" fill="#d9d4e6" font-size="13" font-family="Arial">自我學習</text><rect x="1308" y="68" width="45" height="23" rx="12" fill="url(#pink)"/><circle cx="1341" cy="79.5" r="8" fill="#fff"/>
  <g font-family="Arial"><rect x="340" y="190" width="42" height="42" rx="13" fill="url(#pink)"/><text x="361" y="218" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">M</text><text x="402" y="208" fill="#ff79d7" font-size="13" font-weight="700">Momo</text><text x="402" y="241" fill="#f4f0fb" font-size="17">你好，我已在本機準備完成。</text><text x="402" y="270" fill="#b1abc1" font-size="15">你可以和我對話、餵入資料、訓練權重，或載入自己的模組。</text>
  <rect x="835" y="326" width="490" height="96" rx="20" fill="#2e2448"/><rect x="1283" y="346" width="38" height="38" rx="12" fill="#3c3850"/><text x="1302" y="372" text-anchor="middle" fill="#fff" font-size="18">Y</text><text x="865" y="357" fill="#ff79d7" font-size="13" font-weight="700">You</text><text x="865" y="392" fill="#fff" font-size="17">什麼是權重？我可以觀察它嗎？</text>
  <rect x="340" y="492" width="42" height="42" rx="13" fill="url(#pink)"/><text x="361" y="520" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">M</text><text x="402" y="510" fill="#ff79d7" font-size="13" font-weight="700">Momo</text><text x="402" y="545" fill="#f4f0fb" font-size="17">權重是模型從資料中調整的數值參數。</text><text x="402" y="575" fill="#b1abc1" font-size="15">權重頁面會顯示張量形狀、參數量、平均值、標準差與訓練步數。</text><text x="402" y="605" fill="#746f89" font-size="12">來源：momo-starter-corpus · 已完成本機增量學習</text></g>
  <rect x="335" y="742" width="1028" height="92" rx="20" fill="#1a172b" stroke="#494162"/><text x="365" y="792" fill="#777188" font-size="16" font-family="Arial">輸入訊息…（Enter 送出，Shift+Enter 換行）</text><rect x="1298" y="762" width="52" height="52" rx="15" fill="url(#pink)"/><text x="1324" y="797" text-anchor="middle" fill="#fff" font-size="27" font-family="Arial">↑</text>
</svg>
