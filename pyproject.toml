[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "momo-lm"
version = "0.2.0"
description = "A local-first trainable AI model with C, C++ and Rust accelerated inference."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Momo-LM contributors"}]
keywords = ["ai", "language-model", "local-ai", "machine-learning", "open-source"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: C",
  "Programming Language :: C++",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pyinstaller>=6.10,<7", "ruff>=0.9,<1"]

[project.scripts]
momo = "momo_lm.cli:main"
momo-lm = "momo_lm.cli:main"

[project.urls]
Homepage = "https://github.com/YanagiKH/Momo-LM"
Repository = "https://github.com/YanagiKH/Momo-LM"
Issues = "https://github.com/YanagiKH/Momo-LM/issues"

[tool.setuptools]
include-package-data = true
py-modules = ["MomoLM"]

[tool.setuptools.packages.find]
include = ["momo_lm*"]

[tool.setuptools.package-data]
momo_lm = ["web/*", "assets/weights/*", "assets/corpus/*", "assets/mods/*", "_native_libs/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
